<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-blue-400 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl px-8 py-10 w-full max-w-md">
    <h2 class="text-3xl font-bold text-blue-600 mb-8 text-center">Sign In</h2>
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
        <input type="text" id="email" name="email" required autocomplete="username"
          class="block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          class="block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
      </div>
      <button type="submit"
        class="w-full py-2 mt-2 bg-gradient-to-r from-indigo-600 to-blue-500 text-white font-semibold rounded-lg shadow-md hover:from-blue-500 hover:to-indigo-600 transition">
        Login
      </button>
    </form>
    <div id="error" class="text-red-500 text-center mt-4 min-h-[1.2em] text-sm"></div>
  </div>
  <script>
    // Redirect to /test.html if JWT token exists
    if (localStorage.getItem('jwt')) {
        window.location.href = '/test.html';
    }
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        localStorage.setItem('jwt', data.token);
        window.location.href = '/test.html';
      } else {
        document.getElementById('error').innerText = data.message || 'Login failed';
      }
    }
  </script>
</body>
</html>
